name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref to save minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Cover the supported LTS lines (20, 22) plus current (24) and dev (25).
        # The smoke test boots the server on each, so a startup regression — e.g.
        # the entrypoint guard breaking on a Node build that lacks import.meta.main
        # (Node 18 / older 20.x/22.x patches before it was backported) — fails CI.
        node: [20, 22, 24, 25]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      # Build (also type-checks) + node:test suite + startup smoke test. The smoke
      # test boots the built server and asserts the handshake + all tools register,
      # so "the server doesn't start" fails CI here. No network is touched.
      - run: npm run verify
